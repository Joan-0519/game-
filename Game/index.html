<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>蜜蜂授粉小遊戲</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game" aria-label="蜜蜂授粉遊戲畫面">
      <div class="stage">
        <div class="play-area">
          <img
            class="sprite sprite--flower sprite--flower-a"
            src="flower1.png"
            alt="花"
            width="72"
            height="72"
          />
          <img
            class="sprite sprite--flower sprite--flower-b"
            src="Flower-4.png"
            alt="花"
            width="72"
            height="72"
          />
          <img
            class="sprite sprite--dragonfly"
            src="dragonfly.png"
            alt="蜻蜓"
            width="64"
            height="64"
          />
          <img
            class="sprite sprite--berry"
            src="berry.png"
            alt="莓果"
            width="56"
            height="56"
          />
          <img
            class="sprite sprite--scallion"
            src="scallion.png"
            alt="蔥"
            width="56"
            height="56"
          />
          <img
            id="pollen-ok-a"
            class="pollen-ok pollen-ok--a"
            src="ok.png"
            alt=""
            width="44"
            height="44"
            aria-hidden="true"
          />
          <img
            id="pollen-ok-b"
            class="pollen-ok pollen-ok--b"
            src="ok.png"
            alt=""
            width="44"
            height="44"
            aria-hidden="true"
          />
          <div
            id="pollen-success"
            class="pollen-success"
            role="status"
            aria-live="polite"
            hidden
          >
            授粉成功
          </div>
          <img
            id="bee"
            class="sprite sprite--bee"
            src="bee.png"
            alt="蜜蜂"
            width="88"
            height="88"
          />
        </div>

        <div class="control-strip" aria-label="方向按鈕">
          <div class="d-pad">
            <button
              type="button"
              class="d-pad__slot d-pad__slot--up"
              data-dir="up"
              aria-label="向上"
            >
              <img
                class="d-pad__arrow d-pad__arrow--up"
                src="arrow.png"
                alt=""
                width="72"
                height="72"
              />
            </button>
            <button
              type="button"
              class="d-pad__slot d-pad__slot--left"
              data-dir="left"
              aria-label="向左"
            >
              <img
                class="d-pad__arrow d-pad__arrow--left"
                src="arrow.png"
                alt=""
                width="72"
                height="72"
              />
            </button>
            <button
              type="button"
              class="d-pad__slot d-pad__slot--right"
              data-dir="right"
              aria-label="向右"
            >
              <img
                class="d-pad__arrow d-pad__arrow--right"
                src="arrow.png"
                alt=""
                width="72"
                height="72"
              />
            </button>
            <button
              type="button"
              class="d-pad__slot d-pad__slot--down"
              data-dir="down"
              aria-label="向下"
            >
              <img
                class="d-pad__arrow d-pad__arrow--down"
                src="arrow.png"
                alt=""
                width="72"
                height="72"
              />
            </button>
          </div>
        </div>
      </div>
    </main>
    <script src="main.js"></script>
  </body>
</html>
